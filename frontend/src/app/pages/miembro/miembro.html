<div class="container mt-5">
  <h2 class="section-title text-white">Sé miembro</h2>
  <p class="text-white-50 mb-4">Elige la sede donde quieres entrenar.</p>

  <div class="row g-4">
    @for (s of sedes; track s.id) {
      <div class="col-md-4">
        <div class="card card-sede border-0 shadow-sm h-100" (click)="sedeMapa.set(s)" style="cursor: pointer">
          <img [src]="s.imagen" class="card-img-top" [alt]="s.nombre" />
          <div class="card-body d-flex flex-column">
            <h5 class="fw-bold">{{ s.nombre }}</h5>
            <p class="text-white-50 small">
              <i class="bi bi-geo-alt text-primary me-1"></i>
              {{ s.direccion }}
            </p>
            <a [routerLink]="['/planes', s.id]" class="btn btn-primary mt-auto fw-bold">Ver planes</a>
          </div>
        </div>
      </div>
    }
  </div>
</div>

<div class="container my-5">
  <h2 class="text-center text-white mb-4">Encuentra tu sede: {{ sedeMapa().nombre }}</h2>
  <iframe
    title="Mapa de la sede"
    [src]="mapa()"
    width="100%"
    height="350"
    style="border: 0; border-radius: 15px"
  ></iframe>
</div>
