<div class="page-rec">
  <app-logo-esquina />
  <div class="container d-flex justify-content-center">
    <div class="card rec-card shadow p-4">
      <h2 class="text-center fw-bold mb-1 text-white">Recuperar Acceso</h2>
      <p class="text-center text-white-50 small mb-4">
        Ingresa tu correo y te enviaremos un código para crear una nueva contraseña
      </p>

      @if (error()) {
        <div class="alert alert-danger text-center small py-2">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="enviarCodigo()">
        <app-campo etiqueta="Correo electrónico registrado" clase="form-control-custom" contenedor="mb-4"
          tipo="email" placeholder="correo@ejemplo.com" [control]="form.controls.correo" />

        <button type="submit" class="btn btn-submit w-100 py-2">Enviar Código</button>
      </form>

      <div class="text-center mt-4 text-white-50 small">
        ¿Ya lo recordaste?
        <a routerLink="/login" class="text-decoration-underline link-back text-primary">Volver al login</a>
      </div>
    </div>
  </div>
</div>
