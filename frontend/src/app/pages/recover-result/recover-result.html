<div class="page-rec">
  <app-logo-esquina />
  <div class="container d-flex justify-content-center">
    <div class="card rec-card shadow p-4">
      <div class="text-center mb-3">
        <i class="bi bi-envelope-check-fill text-primary fs-1"></i>
        <h2 class="fw-bold mt-2 text-white">Código Enviado</h2>
        <p class="text-white-50 small">Revisa tu bandeja de entrada o spam y pega el código aquí.</p>
      </div>

      @if (mensaje) {
        <div class="alert alert-success text-center small py-2 fw-bold">{{ mensaje }}</div>
      }
      @if (error()) {
        <div class="alert alert-danger text-center small py-2 fw-bold">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="validarCodigo()">
        <app-campo etiqueta="Código de seguridad" clase="form-control-custom text-center fw-bold font-monospace"
          contenedor="mb-4" placeholder="Ej: a1b2c3d4-..." [control]="form.controls.token" />

        <button type="submit" class="btn btn-submit w-100 py-2">Validar Código</button>
      </form>

      <div class="text-center mt-4 text-white-50 small">
        ¿No te llegó nada?
        <a routerLink="/recover" class="text-decoration-underline link-back text-primary">Volver a intentar</a>
      </div>
    </div>
  </div>
</div>
