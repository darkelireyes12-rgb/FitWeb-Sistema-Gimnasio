<nav class="navbar navbar-dark bg-dark border-bottom border-secondary border-opacity-25 shadow-sm">
  <div class="container">
    <a class="navbar-brand p-0 m-0" [routerLink]="auth.usuario() ? '/perfil' : '/'">
      <img src="/logo-fitweb.png" alt="FitWeb" height="40" style="display: block" />
    </a>

    <div class="ms-auto d-flex align-items-center gap-3">
      @if (auth.usuario(); as usuario) {
        @if (usuario.rol === 'ADMIN') {
          <a class="nav-link text-secondary" routerLink="/admin">Panel admin</a>
        } @else {
          <a class="nav-link text-secondary" routerLink="/reservas">Mis reservas</a>
        }
        <a class="nav-link text-white fw-bold" routerLink="/perfil">Mi perfil</a>
      } @else {
        <a class="nav-link text-secondary" routerLink="/">Inicio</a>
        <a class="nav-link text-secondary" routerLink="/login">Iniciar sesión</a>
        <a class="btn btn-primary btn-sm px-3 fw-bold" routerLink="/miembro">Sé miembro</a>
      }
    </div>
  </div>
</nav>
